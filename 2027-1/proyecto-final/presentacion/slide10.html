<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consultorio Seguro — Escenario</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=Newsreader:ital,wght@1,500;1,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="deck.css">
<script src="theme.js"></script>
<style>
  .scene { position:absolute; inset:0; z-index:2; display:grid; grid-template-columns:1.05fr 1fr; }
  .scene .pane-img { position:relative; overflow:hidden; }
  .scene .pane-img img { width:100%; height:100%; object-fit:cover; object-position:center; filter:saturate(1.04) contrast(1.03); }
  .scene .pane-img::after { content:""; position:absolute; inset:0; box-shadow:inset -60px 0 80px -30px var(--bg-1), inset 0 0 0 1px var(--panel-line); pointer-events:none; }
  .scene .pane-text { padding:150px 90px 120px 70px; display:flex; flex-direction:column; justify-content:center; }
</style>
</head>
<body>
<div class="scaler">
  <div class="slide">
    <div class="scene">
      <div class="pane-img">
        <img src="media/consultorio-unity.jpg" alt="Captura del consultorio dental virtual en Unity">
      </div>
      <div class="pane-text">
        <p style="font-family:var(--font-head);font-weight:700;font-size:16px;letter-spacing:.3em;text-transform:uppercase;color:var(--guinda);margin-bottom:16px;">06 · Descripción del AVI</p>
        <h2 class="title" style="font-size:52px;">Consultorio dental <span class="accent">virtual</span></h2>
        <div class="title-rule"><span class="line"></span><span class="diamond"></span></div>
        <p class="body-text" style="font-size:23px;max-width:560px;">Captura real del consultorio dental virtual que sirve como base del entorno de simulación: objetos operativos, botes de residuos y mobiliario de apoyo distribuidos dentro de la escena.</p>
      </div>
    </div>
  </div>
</div>
<script src="slides.js"></script>
<script src="chrome.js"></script>
<script src="slide.js"></script>
<script src="anim.js"></script>
</body>
</html>
